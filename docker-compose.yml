name: ngocanh-auth

services:
  mongodb:
    image: mongo:7
    container_name: auth-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: auth-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: auth-service
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      MONGODB_URI: mongodb://mongodb:27017/auth-db
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-secret-change-me-before-deploying-32}
      BETTER_AUTH_URL: http://localhost:4000
      FRONTEND_URL: http://localhost:4000
      JWT_ISSUER: ${JWT_ISSUER:-auth.yourdomain.com}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-api.yourdomain.com}
      ACCESS_TOKEN_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:4000
      MAIL_TRANSPORT: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: "Auth System <noreply@auth.example.com>"
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@gmail.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-1234}
      RATE_LIMIT_ENABLED: "false"
    depends_on:
      mongodb:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  product:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: product-service
    command: ["bun", "run", "services/product-service/src/server.ts"]
    ports:
      - "4002:4002"
    environment:
      PORT: 4002
      PRODUCT_MONGODB_URI: mongodb://mongodb:27017/product-db
      JWKS_URL: http://auth:4000/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER:-auth.yourdomain.com}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-api.yourdomain.com}
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      auth:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: stepstyle-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: stepstyle_db
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Store-configuration schema (caidatcuahang, caidatphuongthucthanhtoan,
      # caidatdoitacvanchuyen) — loaded on first boot.
      - ./services/admin-services/system-config-service/StepStyle-v2.sql:/docker-entrypoint-initdb.d/stepstyle-v2.sql:ro
      # After-Sales & Feedback schema (danhgia, yeucauhaumai) — runs after stepstyle-v2.sql on fresh DB init.
      - ./services/user-services/after-sales-service/migrations/001_after_sales.sql:/docker-entrypoint-initdb.d/zz-after-sales.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  settings:
    build:
      context: ./services/admin-services/system-config-service
      dockerfile: Dockerfile
    container_name: system-config-service
    ports:
      - "4004:4004"
    environment:
      ENVIRONMENT: production
      PORT: 4004
      DATABASE_URL: mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD:-root}@mysql:3306/stepstyle_db
      JWKS_URL: http://auth:4000/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER:-auth.yourdomain.com}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-api.yourdomain.com}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy
      auth:
        condition: service_healthy
    restart: unless-stopped

  users:
    build:
      context: ./services/admin-services/user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "4005:4005"
    environment:
      ENVIRONMENT: production
      PORT: 4005
      DATABASE_URL: mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD:-root}@mysql:3306/stepstyle_db
      AUTH_SERVICE_URL: http://auth:4000
      JWKS_URL: http://auth:4000/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER:-auth.yourdomain.com}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-api.yourdomain.com}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:4000
    depends_on:
      mysql:
        condition: service_healthy
      auth:
        condition: service_healthy
    restart: unless-stopped

  reporting:
    build:
      context: ./services/admin-services/reporting-service/reporting-service
      dockerfile: Dockerfile
    container_name: reporting-service
    ports:
      - "4006:4006"
    environment:
      ENVIRONMENT: production
      PORT: 4006
      DATABASE_URL: mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD:-root}@mysql:3306/stepstyle_db
      JWKS_URL: http://auth:4000/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER:-auth.yourdomain.com}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-api.yourdomain.com}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:4000
    depends_on:
      mysql:
        condition: service_healthy
      auth:
        condition: service_healthy
    restart: unless-stopped

  orders:
    build:
      context: ./services/admin-services/order-service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "4007:4007"
    environment:
      ENVIRONMENT: production
      PORT: 4007
      DATABASE_URL: mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD:-root}@mysql:3306/stepstyle_db
      JWKS_URL: http://auth:4000/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER:-auth.yourdomain.com}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-api.yourdomain.com}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:4000
    depends_on:
      mysql:
        condition: service_healthy
      auth:
        condition: service_healthy
    restart: unless-stopped
  admin-product:
    build:
      context: ./services/admin-services/product-service
      dockerfile: Dockerfile
    container_name: admin-product-service
    ports:
      - "4008:4008"
    environment:
      ENVIRONMENT: production
      PORT: 4008
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-root}@mysql:3306/stepstyle_db
      JWKS_URL: http://auth:4000/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER:-auth.yourdomain.com}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-api.yourdomain.com}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:4000
    depends_on:
      mysql:
        condition: service_healthy
      auth:
        condition: service_healthy
    restart: unless-stopped
  checkout-service:
    build: 
      context: ./services/user-services/order-services
      dockerfile: Dockerfile
    container_name: laravel-checkout-service
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Laravel
      APP_ENV: local
      APP_KEY: ${ORDER_APP_KEY:-base64:sCKfjSraX4hzHkBJYmpJcmAtmboAqNHBaJShfZiSI9M=}
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: stepstyle_db
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SESSION_DRIVER: database
      CACHE_STORE: database
      FRONTEND_URL: http://localhost:5173
      ORDER_SERVICE_URL: http://127.0.0.1:8000
      AUTH_SERVICE_URL: http://auth:4000
      USER_SERVICE_URL: http://loyalty:8002
      MOMO_ENDPOINT: ${MOMO_ENDPOINT:-https://test-payment.momo.vn/v2/gateway/api/create}
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE:-MOMOBKUN20180529}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY:-klm05TvNBzhg7h7j}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY:-at67qH6mk8w5Y1nAyMoYKMWACiEi2bsa}
      VNPAY_URL: ${VNPAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-H0FXLGFO}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-IJVDDNUKRJBYDUZUQPYVQCJEIBMTNRRU}
    depends_on:
      mysql:
        condition: service_healthy
      auth:
        condition: service_healthy
    restart: unless-stopped
  loyalty:
    build:
      context: ./services/user-services/loyalty-services
      dockerfile: Dockerfile
    container_name: loyalty-service
    ports:
      - "8002:8002"
    environment:
      PORT: "8002"
      DATABASE_URL: mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD:-root}@mysql:3306/stepstyle_db?charset=utf8mb4
      JWKS_URL: http://auth:4000/.well-known/jwks.json
      AUTH_SERVICE_URL: http://auth:4000
      JWT_ISSUER: ${JWT_ISSUER:-auth.yourdomain.com}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-api.yourdomain.com}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy
      auth:
        condition: service_healthy
    restart: unless-stopped

  after-sales:
    build:
      context: ./services/user-services/after-sales-service
      dockerfile: Dockerfile
    container_name: after-sales-service
    ports:
      - "8005:8005"
    environment:
      SECRET_KEY: ${AFTER_SALES_SECRET_KEY:-dev-only-change-me}
      DEBUG: "false"
      DB_NAME: stepstyle_db
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      DB_HOST: mysql
      DB_PORT: "3306"
      ORDER_SERVICE_URL: http://checkout-service:8000
      ORDER_SERVICE_TIMEOUT: "5"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL:-http://host.docker.internal:8083}
      CATALOG_SERVICE_TIMEOUT: "3"
      CATALOG_SYNC_ENABLED: "true"
      JWKS_URL: http://auth:4000/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER:-auth.yourdomain.com}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-api.yourdomain.com}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      checkout-service:
        condition: service_started
    restart: unless-stopped
volumes:

  mongodb-data:
  mysql-data:

