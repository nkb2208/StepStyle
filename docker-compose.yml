name: ngocanh-auth

services:
  mongodb:
    image: mongo:7
    container_name: auth-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: auth-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: auth-service
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongodb:27017/auth-db
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-secret-change-me-before-deploying-32}
      BETTER_AUTH_URL: http://localhost:4000
      FRONTEND_URL: http://localhost:4000
      JWT_ISSUER: ${JWT_ISSUER:-auth.yourdomain.com}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-api.yourdomain.com}
      ACCESS_TOKEN_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:4000
      MAIL_TRANSPORT: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: "Auth System <noreply@auth.example.com>"
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      mongodb:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  product:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: product-service
    command: ["bun", "run", "services/product-service/src/server.ts"]
    ports:
      - "4002:4002"
    environment:
      PORT: 4002
      PRODUCT_MONGODB_URI: mongodb://mongodb:27017/product-db
      JWKS_URL: http://auth:4000/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER:-auth.yourdomain.com}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-api.yourdomain.com}
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      auth:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: stepstyle-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: stepstyle_db
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Store-configuration schema (caidatcuahang, caidatphuongthucthanhtoan,
      # caidatdoitacvanchuyen) — loaded on first boot.
      - ./services/admin-services/system-config-service/StepStyle-v2.sql:/docker-entrypoint-initdb.d/stepstyle-v2.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  settings:
    build:
      context: ./services/admin-services/system-config-service
      dockerfile: Dockerfile
    container_name: system-config-service
    ports:
      - "4004:4004"
    environment:
      ENVIRONMENT: production
      PORT: 4004
      DATABASE_URL: mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD:-root}@mysql:3306/stepstyle_db
      JWKS_URL: http://auth:4000/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER:-auth.yourdomain.com}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-api.yourdomain.com}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy
      auth:
        condition: service_healthy
    restart: unless-stopped

  reporting:
    build:
      context: ./services/admin-services/reporting-service
      dockerfile: Dockerfile
    container_name: reporting-service
    ports:
      - "4006:4006"
    environment:
      ENVIRONMENT: production
      PORT: 4006
      DATABASE_URL: mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD:-root}@mysql:3306/stepstyle_db
      JWKS_URL: http://auth:4000/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER:-auth.yourdomain.com}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-api.yourdomain.com}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy
      auth:
        condition: service_healthy
    restart: unless-stopped

volumes:

  mongodb-data:
  mysql-data:
