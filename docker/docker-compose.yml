version: "3.8"

services:
  auth-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: auth-service
    ports:
      - "3001:3001"
    env_file:
      - ../.env
    volumes:
      - ./config:/app/config
    depends_on:
      - mongodb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mongodb:
    image: mongo:7
    container_name: auth-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: auth-service
    restart: unless-stopped

  mongo-express:
    image: mongoexpress/mongo-express
    container_name: mongo-express
    ports:
      - "8081:8081"
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  mongodb-data: