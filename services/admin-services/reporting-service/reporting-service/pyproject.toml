[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reporting"
version = "1.0.0"
description = "StepStyle Analytics & Reporting Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiomysql>=0.2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "pyjwt[crypto]>=2.8",
    "httpx>=0.27",
]

[project.scripts]
reporting = "reporting.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reporting"]
