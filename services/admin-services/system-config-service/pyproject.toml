[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "systemconfig"
version = "1.0.0"
description = "StepStyle System Configuration Service: admin-only FastAPI over the store configuration tables of stepstyle_db (caidatcuahang, caidatphuongthucthanhtoan, caidatdoitacvanchuyen)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiomysql>=0.2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "email-validator>=2.1",
    "pyjwt[crypto]>=2.8",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "aiosqlite>=0.20", "ruff>=0.6"]

[project.scripts]
systemconfig = "systemconfig.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # FastAPI idiom: Depends()/Query() values live in the defaults.
    "B008",
]
