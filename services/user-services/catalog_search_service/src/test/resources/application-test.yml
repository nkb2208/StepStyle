server:
  port: 0

spring:
  application:
    name: stepstyle-catalog-service-test

  datasource:
    url: jdbc:h2:mem:stepstyle_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ''

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

app:
  ranking:
    prior-mean: 3.5
    min-reviews: 10.0
    rating-weight: 2.0
    sold-weight: 1.5
    review-weight: 1.0
